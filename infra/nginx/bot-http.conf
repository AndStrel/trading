# Managed by trading Mini App setup. Separate vhost; no BrewNote edits.
server {
    listen 80;
    listen [::]:80;
    server_name bot.brewnote.net;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/trading-acme;
        default_type text/plain;
    }
    location / { return 301 https://bot.brewnote.net$request_uri; }
}
