name: andstrel-trading

services:
  telegram-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      T_INVEST_JOURNAL_PATH: /app/data/journal.sqlite
      T_INVEST_MARKET_DATA_PATH: /app/data/market-data.sqlite
    volumes:
      - trading-journal:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  trading-journal:
