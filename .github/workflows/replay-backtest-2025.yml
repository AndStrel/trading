name: Replay 2025 historical data

# This is a one-off job. Run it manually only after Bootstrap 2025 historical data has
# completed successfully and populated the existing Docker volume. It does not send a token
# or data archive to GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize against deploy and archive bootstrap. The remote part also builds the current main
# image itself, so it is correct regardless of which workflow acquires the lock first.
concurrency:
  group: trading-telegram-production
  cancel-in-progress: false

jobs:
  replay:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.TRADING_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.TRADING_DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.TRADING_DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.TRADING_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.TRADING_DEPLOY_KNOWN_HOSTS }}
      REPLAY_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Validate deployment configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test "$DEPLOY_PATH" = "/opt/andstrel/trading"

      - name: Configure verified SSH access
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build current main and start replay worker
        run: |
          case "$REPLAY_RUN_ID" in
            ''|*[!0-9]*) echo "Invalid replay run id" >&2; exit 1 ;;
          esac
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            env REPLAY_RUN_ID="$REPLAY_RUN_ID" 'bash -s' <<'REMOTE'
              set -Eeuo pipefail

              deployment_path="/opt/andstrel/trading"

              test -d "$deployment_path/.git"
              test -f "$deployment_path/.env"
              command -v git >/dev/null
              command -v docker >/dev/null
              docker compose version >/dev/null

              cd "$deployment_path"
              git fetch --depth=1 origin main
              git checkout --detach origin/main
              source_commit="$(git rev-parse HEAD)"
              chmod 600 .env
              docker compose up -d --build --remove-orphans

              run_dir="/tmp/trading-replay-${REPLAY_RUN_ID}"
              rm -rf -- "$run_dir"
              install -d -m 700 "$run_dir"
              cat > "$run_dir/worker.sh" <<'WORKER'
              #!/usr/bin/env bash
              set -uo pipefail

              status=0
              cd "$DEPLOY_PATH"
              # Replay loads one ticker at a time; keep a bounded safety budget for the
              # per-ticker candle array without allowing Node to consume the whole VPS.
              docker compose run --rm --no-deps \
                -e NODE_OPTIONS=--max-old-space-size=2048 \
                -e REPLAY_SOURCE_COMMIT="$SOURCE_COMMIT" \
                telegram-service \
                sh -ceu '
                  umask 077
                  report_path="/app/data/backtests/replay-2025-liquid-20.json"
                  report_tmp="${report_path}.tmp.$$"
                  trap "rm -f \"$report_tmp\"" EXIT
                  mkdir -p /app/data/backtests
                  node dist/backtest-replay.js --year 2025 > "$report_tmp"
                  test -s "$report_tmp"
                  mv -f "$report_tmp" "$report_path"
                  trap - EXIT
                ' || status=$?

              printf '%s\n' "$status" > "$RUN_DIR/exit_code"
              exit "$status"
          WORKER
              chmod 700 "$run_dir/worker.sh"
              DEPLOY_PATH="$deployment_path" \
                RUN_DIR="$run_dir" \
                SOURCE_COMMIT="$source_commit" \
                nohup bash "$run_dir/worker.sh" > "$run_dir/worker.log" 2>&1 < /dev/null &
              printf '%s\n' "$!" > "$run_dir/pid"
              echo "Replay worker started: $run_dir"
          REMOTE

      - name: Wait for replay worker
        timeout-minutes: 40
        run: |
          run_dir="/tmp/trading-replay-${REPLAY_RUN_ID}"
          status_error="$RUNNER_TEMP/replay-${REPLAY_RUN_ID}-ssh-error"
          ssh_failures=0
          heartbeat=0
          deadline=$((SECONDS + 2400))

          worker_state() {
            ssh -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "if test -f '$run_dir/exit_code'; then cat '$run_dir/exit_code'; elif test -s '$run_dir/pid' && kill -0 \"\$(cat '$run_dir/pid')\" 2>/dev/null; then printf running; else printf missing; fi" \
              2>"$status_error"
          }

          show_worker_log() {
            ssh -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$DEPLOY_USER@$DEPLOY_HOST" "tail -200 '$run_dir/worker.log'" || true
          }

          while (( SECONDS < deadline )); do
            if state="$(worker_state)"; then
              ssh_failures=0
            else
              ssh_failures=$((ssh_failures + 1))
              echo "[$(date -u +%FT%TZ)] SSH status check failed (${ssh_failures}/6)" >&2
              if (( ssh_failures == 1 || ssh_failures == 3 || ssh_failures == 6 )); then
                sed -n '1,20p' "$status_error" >&2 || true
              fi
              if (( ssh_failures >= 6 )); then
                echo "Cannot verify replay worker status after repeated SSH failures" >&2
                show_worker_log
                exit 1
              fi
              sleep 15
              continue
            fi
            if [[ -z "$state" ]]; then
              echo "Replay worker status check returned an empty state" >&2
              show_worker_log
              exit 1
            fi
            case "$state" in
              running)
                heartbeat=$((heartbeat + 1))
                if (( heartbeat % 4 == 0 )); then
                  echo "[$(date -u +%FT%TZ)] Replay worker is still running"
                fi
                sleep 15
                ;;
              missing)
                echo "Replay worker disappeared without an exit code" >&2
                show_worker_log
                exit 1
                ;;
              0)
                echo "[$(date -u +%FT%TZ)] Replay worker completed successfully"
                exit 0
                ;;
              [0-9]*)
                echo "Replay worker failed with exit code $state" >&2
                show_worker_log
                exit "$state"
                ;;
              *)
                echo "Unexpected replay worker state: $state" >&2
                show_worker_log
                exit 1
                ;;
            esac
          done

          echo "Replay worker timed out" >&2
          show_worker_log
          exit 1

      - name: Download and validate replay report
        run: |
          report_path="$RUNNER_TEMP/replay-2025-liquid-20.json"
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' > "$report_path" <<'REMOTE'
              set -Eeuo pipefail
              cd "/opt/andstrel/trading"
              docker compose exec -T telegram-service \
                sh -ceu '
                  test -s /app/data/backtests/replay-2025-liquid-20.json
                  cat /app/data/backtests/replay-2025-liquid-20.json
                '
          REMOTE
          jq -e . "$report_path" >/dev/null
          test "$(jq -r '.status' "$report_path")" = "ok"

          {
            echo "## Replay 2025 historical data"
            echo
            echo "Source commit: $(jq -r '.sourceCommit' "$report_path")"
            echo
            echo "| Phase | Trades | Net PnL, ₽ | Return | Profit factor |"
            echo "|---|---:|---:|---:|---:|"
            jq -r '.report.phases[] | "| \(.phase.id) | \(.executedTradeCount) | \(.netPnlRub) | \(.returnPct)% | \(.profitFactor // "—") |"' "$report_path"
            echo
            echo "### Warnings"
            jq -r '.report.warnings[]?, .report.phases[]?.warnings[]?' "$report_path" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload replay report
        uses: actions/upload-artifact@v4
        with:
          name: replay-2025-liquid-20-${{ github.run_id }}
          path: ${{ runner.temp }}/replay-2025-liquid-20.json
          if-no-files-found: error
          retention-days: 30
