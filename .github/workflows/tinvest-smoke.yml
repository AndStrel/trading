name: T-Invest read-only smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tinvest-readonly-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify read-only API access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: tinvest-readonly
    env:
      T_INVEST_TOKEN: ${{ secrets.T_INVEST_READONLY_TOKEN }}
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build trusted source
        run: npm run build

      - name: Verify T-Invest authentication
        run: npm run smoke:tinvest
