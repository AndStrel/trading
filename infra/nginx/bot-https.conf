# Managed by trading Mini App setup. Separate vhost; no BrewNote edits.
server {
    listen 80;
    listen [::]:80;
    server_name bot.brewnote.net;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/trading-acme;
        default_type text/plain;
    }
    location / { return 301 https://bot.brewnote.net$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bot.brewnote.net;
    ssl_certificate /opt/andstrel/trading-tls/letsencrypt/live/bot.brewnote.net/fullchain.pem;
    ssl_certificate_key /opt/andstrel/trading-tls/letsencrypt/live/bot.brewnote.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 2k;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host bot.brewnote.net;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
