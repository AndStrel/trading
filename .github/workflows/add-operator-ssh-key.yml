name: Add operator SSH key

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "Single ed25519 public key from the operator Mac"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trading-operator-ssh
  cancel-in-progress: false

jobs:
  add-key:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ vars.TRADING_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.TRADING_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.TRADING_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.TRADING_DEPLOY_KNOWN_HOSTS }}
      OPERATOR_PUBLIC_KEY: ${{ inputs.public_key }}
    steps:
      - name: Validate key and deployment configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s' "$OPERATOR_PUBLIC_KEY" | grep -Eq '^ssh-ed25519 [A-Za-z0-9+/]+={0,3}( .*)?$'

      - name: Configure verified deployment access
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Add the operator public key
        run: |
          operator_key_b64="$(printf '%s' "$OPERATOR_PUBLIC_KEY" | base64 -w 0)"

          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $operator_key_b64" <<'REMOTE'
              set -Eeuo pipefail

              test "$(id -u)" -eq 0
              operator_key="$(printf '%s' "$1" | base64 --decode)"
              printf '%s' "$operator_key" | grep -Eq '^ssh-ed25519 [A-Za-z0-9+/]+={0,3}( .*)?$'

              install -d -m 700 /root/.ssh
              touch /root/.ssh/authorized_keys
              chmod 600 /root/.ssh/authorized_keys

              if ! grep -qxF "$operator_key" /root/.ssh/authorized_keys; then
                printf '%s\n' "$operator_key" >> /root/.ssh/authorized_keys
              fi

              echo "Operator SSH key is present for root."
          REMOTE
