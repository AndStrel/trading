name: Install sandbox secret without enabling orders

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-telegram-production
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.TRADING_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.TRADING_DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.TRADING_DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.TRADING_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.TRADING_DEPLOY_KNOWN_HOSTS }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Configure verified SSH access
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test "$DEPLOY_PATH" = "/opt/andstrel/trading"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Install stdin-only sandbox secret with disabled execution
        env:
          SANDBOX_SECRET: ${{ secrets.T_INVEST_SANDBOX_TOKEN }}
        run: |
          set -eu
          test -n "$SANDBOX_SECRET"
          printf '%s' "$SANDBOX_SECRET" | ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "python3 /opt/andstrel/trading/ops/install_sandbox_secret.py --expected-sha $EXPECTED_SHA --apply"
